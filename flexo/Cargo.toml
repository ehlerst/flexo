[package]
name = "flexo"
version = "1.7.0-beta4"
authors = ["Fabian Muscariello <nroi@mailbox.org>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
curl = "0.4.49"
libc = "0.2.186"
http = "0.2.12"
rand = "0.8.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.7.8"
crossbeam = "0.8.4"
httparse = "1.10"
walkdir = "2.5"
log = "0.4.29"
chrono = { version = "0.4", features = ["serde"] }
humantime = "2.3.0"
env_logger = "0.10"
glob = "0.3.3"
regex = "1.12"
httpdate = "1.0.3"
uuid = { version = "1.23", features = ["v4"] }
prometheus = "0.13"
lazy_static = "1.5"
thiserror = "1.0"
threadpool = "1.8"
num_cpus = "1.13"
clap = { version = "4.5", features = ["derive"] }
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
tempfile = "3.2.0"

