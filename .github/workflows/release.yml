name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Release (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            archive: flexo-linux-amd64
          - target: aarch64-unknown-linux-gnu
            archive: flexo-linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross
        run: cargo install cross --git https://github.com/cross-rs/cross.git

      - name: Build
        run: cross build --release --target ${{ matrix.target }} --locked --verbose
        working-directory: ./flexo

      - name: Package
        run: |
          mkdir -p dist
          cp flexo/target/${{ matrix.target }}/release/flexo dist/
          cd dist && tar -czvf ${{ matrix.archive }}.tar.gz flexo

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.archive }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
